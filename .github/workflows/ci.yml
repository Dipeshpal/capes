name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install fastapi aiohttp python-dotenv httpx
      - run: python tests/protocol.py
      - run: python tests/gmail_offline.py
      - run: python tests/check_docs.py
      - run: node --check scripts/pulse.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .claude/skills/security-audit/scan.sh --strict
