<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>pulse-mcp dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M4 17h6l3-8 5 15 3-7h7' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <noscript><p class="notice">This dashboard needs JavaScript.</p></noscript>

  <section id="login" class="login" hidden aria-labelledby="login-title">
    <form id="login-form" class="card login-card" autocomplete="on">
      <h1 id="login-title">pulse-mcp</h1>
      <p class="muted">Sign in with your <code>MCP_API_KEY</code>.</p>
      <label for="key">MCP API key</label>
      <input id="key" name="password" type="password" autocomplete="current-password" required minlength="24" spellcheck="false">
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="muted small">The key is the one you set on Vercel. It is never stored in the browser; a signed, HttpOnly session cookie is used.</p>
    </form>
  </section>

  <div id="shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span><strong>pulse-mcp</strong></div>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Dashboard sections"></nav>
      <button id="logout" class="btn ghost" type="button">Sign out</button>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <dialog id="try-dialog" class="dialog" aria-labelledby="try-title">
    <form method="dialog" class="dialog-head"><h2 id="try-title"></h2><button class="btn ghost" aria-label="Close">Close</button></form>
    <p id="try-desc" class="muted"></p>
    <form id="try-form" class="stack"></form>
    <pre id="try-output" class="output" hidden></pre>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/dashboard/app.js" defer></script>
</body>
</html>
